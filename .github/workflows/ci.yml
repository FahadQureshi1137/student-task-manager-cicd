# What is ci.yml?
#
# Think of ci.yml as an instruction sheet for GitHub.
#
# When GitHub sees:
#
# .github/workflows/ci.yml
#
# it knows:
#
# "This is a GitHub Actions workflow.
# I need to read this file and execute the instructions inside it."

# This is simply the name of the workflow you'll see in GitHub Actions.
name: CI Pipeline

# This tells GitHub when to run the workflow.
#
# In plain English:
# "Run this workflow whenever someone pushes code to main."
on:
  push:
    branches:
      - main

# This defines our jobs.
jobs:
  # Our job is called "test".
  test:
    # Run this job on an Ubuntu machine.
    runs-on: ubuntu-latest

    # Start a temporary MySQL server for this CI job.
    services:
      mysql:
        # Use the official MySQL 8.0 Docker image.
        image: mysql:8.0

        # Configure the MySQL server.
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: student_task_manager

        ports:
          - 3306:3306

        # Tell Docker to check whether MySQL is ready.
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    # These are the commands/actions executed inside the job.
    steps:
      # Take the code from my GitHub repository
      # and place it on the Ubuntu runner.
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up PHP 8.2 for our project.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"

      # Check which PHP version is currently available
      # on the GitHub Actions Ubuntu runner.
      - name: Check PHP version
        run: php --version

      # Find every PHP file in the project
      # and check each one for syntax errors.
      - name: Check PHP syntax
        run: |
          find . -type f -name "*.php" -exec php -l {} \;

      # Run our PHP test file.
      #
      # If the test passes, the command exits with status 0.
      # If the test fails, exit(1) makes the CI step fail.
      - name: Run PHP test
        run: php tests/test.php

      # Test whether PHP can successfully connect to MySQL.
      - name: Test MySQL connection
        run: |
          php -r '
          $conn = new mysqli("127.0.0.1", "root", "root", "student_task_manager");
          if ($conn->connect_error) {
              die("MySQL connection failed: " . $conn->connect_error);
          }
          echo "MySQL connection successful!";
          '

      # Log in to Docker Hub using the credentials
      # stored securely in GitHub repository secrets.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Build the Docker image from our Dockerfile.
      - name: Build Docker image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/student-task-manager:latest .

      # Push the Docker image to Docker Hub.
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/student-task-manager:latest

      # Deploy the latest Docker image to our EC2 server.
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull fahadf5/student-task-manager:latest
            docker stop student-task-manager-app || true
            docker rm student-task-manager-app || true
            docker run -d \
              --name student-task-manager-app \
              -p 8081:80 \
              fahadf5/student-task-manager:latest
